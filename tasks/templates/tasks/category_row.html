<div class="managed-category grid min-h-14 grid-cols-[minmax(80px,1fr)_40px_40px] items-center gap-2 border-b border-paper-line py-2" data-update-url="{% if category.pk %}{% url 'tasks:update-category' category.pk %}{% endif %}" data-delete-url="{% if category.pk %}{% url 'tasks:delete-category' category.pk %}{% endif %}">
    <input class="category-name min-h-10 min-w-0 rounded-sm border border-transparent bg-transparent px-2 text-xs font-bold focus:border-paper-line focus:outline-none" value="{{ category.name|default:'' }}" maxlength="80" aria-label="Tag name">
    <div class="category-color-picker relative flex h-10 w-10 items-center">
        <button class="color-picker-toggle grid h-10 w-10 place-items-center rounded-sm border border-paper-line hover:bg-paper-faint focus-visible:outline-2 focus-visible:outline-forest" type="button" aria-label="Choose tag color" aria-expanded="false" title="Choose tag color" style="--swatch-color: {{ category.color|default:'#c5dfc5' }}"><span class="h-5 w-5 rounded-sm border border-black/10 bg-[var(--swatch-color)]"></span></button>
    <div class="category-colors absolute right-0 top-[calc(100%+4px)] z-20 grid w-max grid-cols-4 gap-1 rounded-sm border border-paper-line bg-surface p-2 shadow-lg" role="radiogroup" aria-label="Tag color" hidden>
        {% for color, label in category_colors %}
            <button class="color-option grid h-10 w-10 cursor-pointer place-items-center rounded-sm transition-colors hover:bg-paper-faint focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-forest" type="button" role="radio" aria-label="{{ label }}" aria-checked="{% if category.color == color or not category.pk and color == '#c5dfc5' %}true{% else %}false{% endif %}" title="{{ label }}" data-color="{{ color }}" style="--swatch-color: {{ color }}"><span class="color-swatch h-5 w-5 rounded-sm border border-black/10 bg-[var(--swatch-color)]{% if category.color == color or not category.pk and color == '#c5dfc5' %} ring-2 ring-offset-1 ring-offset-paper ring-forest{% endif %}"></span></button>
        {% endfor %}
    </div>
    </div>
    <button class="delete-category grid h-10 w-10 place-items-center rounded-sm text-ink-muted transition-colors hover:bg-rust/10 hover:text-rust focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-forest" type="button" aria-label="Delete tag {{ category.name }}" title="Delete tag"><i data-lucide="trash-2"></i></button>
</div>
