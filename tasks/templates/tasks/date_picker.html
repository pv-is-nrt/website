<div class="date-picker-wrapper {{ wrapper_class }} relative" data-date-picker-wrapper data-empty-label="{{ empty_label }}" data-compact="{{ compact|yesno:'true,false' }}" data-due-action="{{ due_action|yesno:'true,false' }}">
    <button class="date-picker-button {{ button_class }}{% if due_action and value %} icon-themed icon-mustard{% endif %}" type="button" aria-label="{{ button_label }}" aria-haspopup="dialog" aria-expanded="false" title="{{ button_label }}">
        <i data-lucide="calendar-clock"></i><span class="date-picker-label {{ label_class }}">{% if value %}{{ value|date:display_format }}{% else %}{{ empty_label }}{% endif %}</span>
    </button>
    <input class="date-picker-input absolute h-px w-px overflow-hidden opacity-0" type="datetime-local" data-field="{{ field }}" value="{{ value|date:'Y-m-d\TH:i' }}" aria-label="{{ input_label }}" tabindex="-1">
    <div class="date-time-picker fixed left-0 top-0 z-50 w-72 max-w-[calc(100vw-32px)] rounded-sm border border-paper-line bg-surface p-3 text-ink shadow-lg" hidden role="dialog" aria-label="{{ dialog_label }}">
        <div class="mb-2 flex items-center justify-between gap-2">
            <button class="grid h-8 w-8 place-items-center rounded-sm text-ink-muted hover:bg-paper-faint hover:text-ink focus-visible:outline-2 focus-visible:outline-forest" type="button" data-calendar-month="-1" aria-label="Previous month"><i data-lucide="chevron-left"></i></button>
            <span class="font-semibold text-sm" data-calendar-month-label aria-live="polite"></span>
            <button class="grid h-8 w-8 place-items-center rounded-sm text-ink-muted hover:bg-paper-faint hover:text-ink focus-visible:outline-2 focus-visible:outline-forest" type="button" data-calendar-month="1" aria-label="Next month"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="mb-1 grid grid-cols-7 gap-1 text-center font-mono text-[0.62rem] text-ink-muted" aria-hidden="true"><span class="grid h-8 w-8 place-items-center">Su</span><span class="grid h-8 w-8 place-items-center">Mo</span><span class="grid h-8 w-8 place-items-center">Tu</span><span class="grid h-8 w-8 place-items-center">We</span><span class="grid h-8 w-8 place-items-center">Th</span><span class="grid h-8 w-8 place-items-center">Fr</span><span class="grid h-8 w-8 place-items-center">Sa</span></div>
        <div class="grid grid-cols-7 gap-1 text-center text-sm" data-calendar-grid role="group" aria-label="Dates in month"></div>
        <label class="mt-3 grid grid-cols-[auto_1fr] items-center gap-3 border-t border-paper-line pt-3 text-xs font-medium text-ink-muted">
            <span>Time</span>
            <input class="date-picker-time min-h-9 rounded-sm border border-paper-line bg-surface px-2 text-sm text-ink focus:border-forest focus:outline-none" type="time" aria-label="Time" value="09:00">
        </label>
        <div class="mt-2 flex justify-between">
            <button class="date-picker-today min-h-9 rounded-sm px-2 text-xs font-semibold text-forest underline underline-offset-2 hover:bg-paper-faint" type="button">Today</button>
            {% if clearable %}<button class="date-picker-clear min-h-9 rounded-sm px-2 text-xs font-semibold text-ink-muted underline underline-offset-2 hover:bg-paper-faint" type="button">Clear date</button>{% endif %}
        </div>
    </div>
</div>
